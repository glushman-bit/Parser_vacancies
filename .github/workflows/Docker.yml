name: Docker

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            glushman/parser_vacancies:${{ github.sha }}
            glushman/parser_vacancies:latest
            
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/parser_vacancies
            
            IMAGE_TAG="${{ github.sha }}"
            
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            
            docker compose pull web
            docker compose up -d --force-recreate web
            
            echo "Waiting for web container..."
            
            for i in {1..30}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' parser_vacancies-web-1 2>/dev/null || true)
              
              echo "Health status: $STATUS"
            
              if [ "$STATUS" = "healthy" ]; then
                echo "Web is healthy"
                break
              fi
            
              if [ "$STATUS" = "unhealthy" ]; then
                echo "Web is unhealthy"
                docker compose logs --tail=50 web
                exit 1
              fi
            
              sleep 2
            done
            
            if [ "$STATUS" != "healthy" ]; then
              echo "Web did not become healthy in time"
              docker compose logs --tail=50 web
              exit 1
            fi
            
            docker compose up -d --force-recreate nginx
            docker compose ps
