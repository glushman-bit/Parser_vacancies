{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Парсер вакансий HH.ru{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            color: #212529;
        }
        header {
            background: #234e8c;
            color: #fff;
            padding: 16px 24px;
        }
        header .container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; }
        header a { color: #fff; text-decoration: none; }
        main { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
        .card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .menu { list-style: none; padding: 0; margin: 0; }
        .menu li { margin-bottom: 10px; }
        .btn {
            display: inline-block;
            background: #234e8c;
            color: #fff;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }
        .btn:hover { background: #1b3b6b; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #545b62; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td { border: 1px solid #dee2e6; padding: 8px 12px; text-align: left; }
        th { background: #e9ecef; }
        tr:nth-child(even) { background: #f8f9fa; }
        .message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .hint { color: #6c757d; font-size: 14px; }
        form.search { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; }
    </style>
</head>
<body>
<header>
    <div class="container">
        <h1><a href="/">Парсер вакансий HH.ru</a></h1>
        <a href="/api/">REST API</a>
    </div>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
